<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    color: gold;
}


.card {
    opacity: 0;
    animation: fadeSlideUp 2s ease forwards;
    animation-delay: 1.2s;
}


button {
    padding: 10px 18px;
    margin: 8px;
    border: none;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
}
.slider {
    position: relative;
    width: 100%;
    height: 220px;
    margin-bottom: 20px;
    overflow: hidden;
    border-radius: 15px;
}

.slider {
    width: 100%;
    height: 220px;
    overflow: hidden;
    border-radius: 15px;
    margin-bottom: 20px;
    position: relative;
}

.slider img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
}

.slider img:first-child {
    display: block;
}
.polaroid-container {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -2;
}

.polaroid {
    position: absolute;
    width: 130px;
    background: #111;
    padding: 8px 8px 25px 8px;
    border-radius: 5px;
    box-shadow: 0 0 20px rgba(255,215,0,0.4);
    animation: float 6s ease-in-out infinite alternate;
}

.polaroid img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 3px;
}
.polaroid {
    opacity: 0;
    animation: fadeSlideUp 2s ease forwards;
    animation-delay: 3.8s;
}



@keyframes float {
    from { transform: translateY(0px) rotate(-5deg); }
    to { transform: translateY(-12px) rotate(-5deg); }
}

.p1 { top: 5%; left: 5%; transform: rotate(-10deg); }
.p2 { top: 15%; right: 8%; transform: rotate(8deg); }
.p3 { bottom: 20%; left: 10%; transform: rotate(5deg); }
.p4 { bottom: 10%; right: 5%; transform: rotate(-8deg); }
.p5 { top: 40%; left: 40%; transform: rotate(3deg); }


/* Make card appear above */
.card {
    opacity: 0;
    animation: fadeSlideUp 2s ease forwards;
    animation-delay: 3.3s;
}

.card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        120deg,
        transparent 40%,
        rgba(255,215,0,0.15) 50%,
        transparent 60%
    );
    transform: rotate(25deg);
    animation: shimmer 6s infinite linear;
}
@keyframes shimmer {
    from { transform: rotate(25deg) translateX(-100%); }
    to { transform: rotate(25deg) translateX(100%); }
}

.fairy-lights {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
    background-image:
        radial-gradient(circle, rgba(255,215,0,0.8) 2px, transparent 3px),
        radial-gradient(circle, rgba(255,215,0,0.6) 2px, transparent 3px);
    background-size: 100px 100px;
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { opacity: 0.5; }
    to { opacity: 1; }
} 
@keyframes shimmer {
    0% {
        transform: translateX(-100%) rotate(25deg);
    }
    100% {
        transform: translateX(100%) rotate(25deg);
    }
}
.luxury-title {
    opacity: 0;
    animation:
        fadeSlideDown 2s ease forwards,
        goldFlow 5s linear infinite,
        glowPulse 3s ease-in-out infinite alternate;
    animation-delay: 2.6s, 2.6s, 2.6s;
}


.luxury-title {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    font-size: 36px;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    letter-spacing: 2px;
    background: linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #fff8dc,
        #ffd700,
        #b8860b
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: goldFlow 5s linear infinite, glowPulse 3s ease-in-out infinite alternate;
    z-index: 20;
}
@keyframes goldFlow {
    0% {
        background-position: 0% center;
    }
    100% {
        background-position: 200% center;
    }
}

@keyframes glowPulse {
    from {
        text-shadow: 0 0 10px rgba(255,215,0,0.4);
    }
    to {
        text-shadow: 0 0 25px rgba(255,215,0,0.8);
    }
}
@keyframes fadeSlideDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeSlideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.intro-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
    animation: introFade 2.5s ease forwards;
}

@keyframes introFade {
    0% {
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        visibility: hidden;
    }
}



</style>
</head>

<body>
    <div class="intro-screen"></div>

    <div class="fairy-lights"></div>

<div class="polaroid-container">
    <div class="polaroid p1"><img src="photo1.jpg.jpeg"></div>
    <div class="polaroid p2"><img src="photo2.jpg.jpeg"></div>
    <div class="polaroid p3"><img src="photo3.jpg.jpeg"></div>
    <div class="polaroid p4"><img src="photo4.jpg.jpeg"></div>
    <div class="polaroid p5"><img src="photo5.jpg.jpeg"></div>
</div>
<h1 class="luxury-title">Our Forever</h1>

<div class="card">
    <h2>Happy Valentine's Day 💖</h2>
    <p>You are my peace, my happiness, my forever. 
    I will always try my best to love you more than yesterday.
    You are my everything and I'll always love you the most, MY BABYGIRL!!! </p>

    <h3>Do you love me? 💕</h3>
    <button onclick="yesLove()">Yes 😍</button>
    <button onclick="transformNo()" id="noBtn">No 😜</button>

    <div id="responseMessage" style="margin-top:15px;"></div>
</div>

<canvas id="confettiCanvas"></canvas>

<audio id="bgMusic" loop preload="auto">
    <source src="yoursong.mp3" type="audio/mpeg">
</audio>



<script>

    let musicStarted = false;

function playMusic() {
    if (!musicStarted) {
        var music = document.getElementById("bgMusic");
        music.volume = 0.4;

        music.play().then(() => {
            musicStarted = true;
        }).catch(error => {
            console.log("Music blocked:", error);
        });
    }
}



function yesLove() {
    playMusic();

    document.getElementById("responseMessage").innerHTML =
        "I knew it! 😍 I love you forever ❤️";

    startConfetti();
}


function transformNo() {
    playMusic();

    var btn = document.getElementById("noBtn");
    btn.innerHTML = "Are you sure? 🥺";

    setTimeout(() => btn.innerHTML = "Think again 😌", 800);
    setTimeout(() => btn.innerHTML = "Okay fine 😏", 1600);
    setTimeout(() => {
        btn.innerHTML = "Yes 😍";
        btn.onclick = yesLove;
    }, 2400);
}


/* LIGHT CONFETTI (Mobile Friendly) */
function startConfetti() {
    var canvas = document.getElementById("confettiCanvas");
    var ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var pieces = [];

    for (var i = 0; i < 60; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 6 + 3,
            speed: Math.random() * 2 + 1
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        pieces.forEach(function(p) {
            ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,60%)";
            ctx.fillRect(p.x, p.y, p.size, p.size);
            p.y += p.speed;

            if (p.y > canvas.height) {
                p.y = 0;
            }
        });

        requestAnimationFrame(draw);
    }

    draw();
}

document.body.addEventListener("click", function() {
    playMusic();
}, { once: true });

window.addEventListener("load", function() {
    let currentSlide = 0;
    const slides = document.querySelectorAll(".slide");

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.remove("active");
            if (i === index) {
                slide.classList.add("active");
            }
        });
    }

    setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }, 3000);
});
let slideIndex = 0;

setInterval(function() {
    const slides = document.querySelectorAll(".slider img");

    slides[slideIndex].style.display = "none";

    slideIndex++;
    if (slideIndex >= slides.length) {
        slideIndex = 0;
    }

    slides[slideIndex].style.display = "block";

}, 3000);


</script>

</body>
</html>
